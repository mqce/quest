<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <title>quest — kinetic · robotic · media art</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", "Hiragino Sans", sans-serif;
      background: #0a0a0a;
      color: #e5e5e5;
      line-height: 1.5;
      color-scheme: dark;
    }

    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    ::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #555;
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: #333 #0a0a0a;
    }

    .header {
      background: #0a0a0a;
      border-bottom: 1px solid #333;
      padding: 1.5rem 3rem;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-content {
      max-width: 1800px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #f5f5f5;
      text-transform: lowercase;
    }

    .controls {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .favorites-toggle {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.8rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .favorites-toggle input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
      accent-color: #f5f5f5;
    }

    .favorites-toggle span {
      color: #e5e5e5;
    }

    .btn-settings {
      padding: 0.5rem 1rem;
      border: 1px solid #666;
      background: transparent;
      color: #e5e5e5;
      cursor: pointer;
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .btn-settings:hover {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    .container {
      max-width: 1800px;
      margin: 0 auto;
      padding: 4rem 3rem;
    }

    .date-section {
      margin-bottom: 6rem;
    }

    .date-heading {
      font-size: 0.75rem;
      font-weight: 400;
      margin-bottom: 3rem;
      color: #777;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
      gap: 4rem 3rem;
    }

    .card {
      background: transparent;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .work-index {
      font-size: 0.65rem;
      color: #666;
      margin-bottom: 0.5rem;
      font-family: 'Courier New', monospace;
      letter-spacing: 0.1em;
    }

    .card-media {
      width: 100%;
      aspect-ratio: 3/2;
      background: #1a1a1a;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      margin-bottom: 1.5rem;
    }

    .card-media img,
    .card-media video,
    .card-media iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .slideshow {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .slideshow-item {
      display: none;
      width: 100%;
      height: 100%;
    }

    .slideshow-item.active {
      display: block;
    }

    .slideshow-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid #666;
      color: #e5e5e5;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.2rem;
      z-index: 5;
      display: none;
      transition: all 0.2s;
    }

    .slideshow-arrow:hover {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    .card-media:hover .slideshow-arrow {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slideshow-arrow.prev {
      left: 1rem;
    }

    .slideshow-arrow.next {
      right: 1rem;
    }

    .slideshow-dots {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 5;
    }

    .slideshow-dot {
      width: 10px;
      height: 10px;
      background: rgba(10, 10, 10, 0.7);
      border: 1px solid #666;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slideshow-dot.active {
      background: #f5f5f5;
      border-color: #f5f5f5;
    }

    .card-media .placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      color: #777;
      font-size: 0.75rem;
      text-align: center;
      padding: 1rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid #333;
    }

    .card-media .placeholder.clickable {
      cursor: pointer;
      transition: all 0.2s;
    }

    .card-media .placeholder.clickable:hover {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    .card-favorite {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid #666;
      color: #e5e5e5;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      z-index: 10;
    }

    .card-favorite:hover {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    .card-favorite.favorited {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    .btn-select-thumbnails {
      position: absolute;
      bottom: 1rem;
      left: 1rem;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid #666;
      color: #e5e5e5;
      padding: 0.5rem 0.9rem;
      cursor: pointer;
      font-size: 0.65rem;
      z-index: 10;
      transition: all 0.2s;
      display: block;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .btn-select-thumbnails:hover {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    .card-body {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.5rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: #f5f5f5;
      line-height: 1.3;
    }

    .card-artist {
      font-size: 0.9rem;
      color: #999;
      margin-bottom: 1rem;
      font-weight: 300;
    }

    .card-summary {
      font-size: 0.95rem;
      color: #b8b8b8;
      margin-bottom: 1.25rem;
      flex: 1;
      line-height: 1.6;
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .tag {
      font-size: 0.7rem;
      padding: 0.25rem 0.6rem;
      background: #1a1a1a;
      color: #999;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border: 1px solid #333;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 1rem;
      border-top: 1px solid #333;
      font-size: 0.7rem;
      color: #777;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .card-footer a {
      color: #e5e5e5;
      text-decoration: none;
      border-bottom: 1px solid #666;
    }

    .card-footer a:hover {
      color: #f5f5f5;
      border-bottom-color: #f5f5f5;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      padding: 2rem;
      overflow-y: auto;
    }

    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #0a0a0a;
      border: 1px solid #333;
      max-width: 900px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
    }

    .modal-media {
      width: 100%;
      max-height: 500px;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-media img,
    .modal-media video {
      max-width: 100%;
      max-height: 500px;
      object-fit: contain;
    }

    .modal-body {
      padding: 2.5rem;
    }

    .modal-body h2 {
      font-size: 1.75rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: #f5f5f5;
    }

    .modal-body p {
      line-height: 1.6;
      color: #b8b8b8;
    }

    .modal-close {
      position: absolute;
      top: 1.5rem;
      right: 1.5rem;
      background: rgba(10, 10, 10, 0.9);
      border: 1px solid #666;
      color: #e5e5e5;
      width: 40px;
      height: 40px;
      cursor: pointer;
      font-size: 1.5rem;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .modal-close:hover {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    .thumbnail-upload {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #1a1a1a;
      border: 1px solid #333;
    }

    .thumbnail-upload h4 {
      font-size: 0.75rem;
      margin-bottom: 1rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #e5e5e5;
    }

    .thumbnail-upload input[type="text"],
    .thumbnail-upload input[type="file"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #666;
      background: #0a0a0a;
      color: #e5e5e5;
      margin-bottom: 0.75rem;
      font-size: 0.875rem;
    }

    .thumbnail-upload input[type="text"]:focus,
    .thumbnail-upload input[type="file"]:focus {
      outline: 1px solid #999;
    }

    .thumbnail-upload button {
      padding: 0.75rem 1.25rem;
      background: #f5f5f5;
      color: #0a0a0a;
      border: 1px solid #f5f5f5;
      cursor: pointer;
      font-size: 0.7rem;
      margin-right: 0.75rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .thumbnail-upload button:hover {
      background: transparent;
      color: #f5f5f5;
    }

    .thumbnail-upload .btn-secondary {
      background: transparent;
      color: #e5e5e5;
      border-color: #666;
    }

    .thumbnail-upload .btn-secondary:hover {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    .candidate-selector {
      margin-top: 2rem;
      padding: 1.5rem;
      background: #1a1a1a;
      border: 1px solid #333;
    }

    .candidate-selector h4 {
      font-size: 0.75rem;
      margin-bottom: 1.25rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #e5e5e5;
    }

    .candidate-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .candidate-item {
      position: relative;
      aspect-ratio: 3/2;
      background: #0a0a0a;
      border: 2px solid #333;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .candidate-item:hover {
      border-color: #999;
    }

    .candidate-item.selected {
      border-color: #f5f5f5;
      border-width: 3px;
    }

    .candidate-item img,
    .candidate-item video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .candidate-order {
      position: absolute;
      top: 0.5rem;
      left: 0.5rem;
      background: #f5f5f5;
      color: #0a0a0a;
      width: 28px;
      height: 28px;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
    }

    .candidate-item.selected .candidate-order {
      display: flex;
    }

    .candidate-controls {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .settings-panel {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      padding: 2rem;
      overflow-y: auto;
    }

    .settings-panel.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .settings-content {
      background: #0a0a0a;
      border: 1px solid #333;
      max-width: 700px;
      width: 100%;
      padding: 2.5rem;
    }

    .settings-content h2 {
      margin-bottom: 2rem;
      font-size: 1.75rem;
      font-weight: 400;
      color: #f5f5f5;
    }

    .settings-content label {
      display: block;
      margin-bottom: 0.75rem;
      font-size: 0.75rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #e5e5e5;
    }

    .settings-content input,
    .settings-content textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #666;
      background: #1a1a1a;
      color: #e5e5e5;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
    }

    .settings-content input:focus,
    .settings-content textarea:focus {
      outline: 1px solid #999;
    }

    .settings-content textarea {
      font-family: 'Courier New', monospace;
      min-height: 150px;
    }

    .settings-content button {
      padding: 0.75rem 1.25rem;
      background: #f5f5f5;
      color: #0a0a0a;
      border: 1px solid #f5f5f5;
      cursor: pointer;
      margin-right: 0.75rem;
      font-size: 0.7rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    .settings-content button:hover {
      background: transparent;
      color: #f5f5f5;
    }

    .settings-content .btn-secondary {
      background: transparent;
      color: #e5e5e5;
      border-color: #666;
    }

    .settings-content .btn-secondary:hover {
      background: #f5f5f5;
      color: #0a0a0a;
      border-color: #f5f5f5;
    }

    .empty-state {
      text-align: center;
      padding: 6rem 2rem;
      color: #777;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-size: 0.75rem;
    }

    .menu-toggle {
      display: none;
      padding: 0.5rem 1rem;
      border: 1px solid #666;
      background: transparent;
      color: #e5e5e5;
      cursor: pointer;
      font-size: 0.7rem;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Courier New', monospace;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    @media (max-width: 768px) {
      .header {
        padding: 1rem 1.5rem;
      }

      h1 {
        font-size: 1.25rem;
      }

      .header-content {
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }

      .controls {
        width: 100%;
        justify-content: space-between;
      }

      .container {
        padding: 3rem 1.5rem;
      }

      .date-section {
        margin-bottom: 4rem;
      }

      .date-heading {
        margin-bottom: 2rem;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 3rem;
      }

      .card-title {
        font-size: 1.25rem;
      }

      .card-artist {
        font-size: 0.85rem;
      }

      .card-summary {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 640px) {
      .header {
        padding: 0.75rem 1rem;
      }

      h1 {
        font-size: 1rem;
      }

      .menu-toggle {
        display: flex;
        width: 100%;
        justify-content: center;
      }

      .controls {
        display: none;
        flex-direction: column;
        gap: 0.75rem;
      }

      .controls.show {
        display: flex;
      }

      .favorites-toggle {
        justify-content: center;
      }

      .btn-settings {
        text-align: center;
      }

      .container {
        padding: 2rem 1rem;
      }

      .date-section {
        margin-bottom: 3rem;
      }

      .date-heading {
        margin-bottom: 1.5rem;
      }

      .grid {
        gap: 2.5rem;
      }

      .card-media {
        aspect-ratio: 4/3;
      }
    }

    @media (hover: none) {
      .slideshow-arrow {
        display: flex;
        align-items: center;
        justify-content: center;
      }
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.25rem;
      }

      .grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 1rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-content">
      <h1>quest</h1>
      
      <button class="menu-toggle" onclick="toggleMenu()">
        <span id="menu-toggle-text">表示設定</span>
      </button>

      <div class="controls" id="controls">
        <label class="favorites-toggle">
          <input type="checkbox" id="favorites-checkbox" onchange="toggleFavoritesFilter()">
          <span>お気に入りのみ</span>
        </label>
        <button class="btn-settings" onclick="openSettings()">設定</button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="gallery"></div>
    <div class="empty-state" id="empty-state" style="display: none;">
      <p>該当する作品が見つかりませんでした。</p>
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <button class="modal-close" onclick="closeModal()">×</button>
      <div class="modal-media" id="modal-media"></div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <div class="settings-panel" id="settings-panel">
    <div class="settings-content">
      <h2>設定</h2>
      
      <label>GitHub Personal Access Token（オプション）</label>
      <input type="password" id="github-token" placeholder="ghp_...">
      <p style="font-size: 0.8rem; color: #999; margin-top: -0.5rem; margin-bottom: 1rem;">
        fine-grained token（Contents: Read and write）を設定すると、お気に入りとサムネイル変更をリポジトリに保存できます。<br>
        未設定の場合はブラウザのlocalStorageに保存されます。
      </p>

      <label>データのエクスポート/インポート</label>
      <div style="margin-bottom: 1rem;">
        <button onclick="exportData()">エクスポート（JSON）</button>
        <button onclick="document.getElementById('import-file').click()" class="btn-secondary">インポート</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="importData(event)">
      </div>

      <textarea id="export-data" placeholder="エクスポートされたデータがここに表示されます" readonly></textarea>

      <div>
        <button onclick="saveSettings()">保存</button>
        <button onclick="closeSettings()" class="btn-secondary">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    let works = [];
    let userData = { favorites: [], thumbnails: {} };
    let showFavoritesOnly = false;

    async function init() {
      await loadWorks();
      await loadUserData();
      renderGallery();
      setupEventListeners();
    }

    async function loadWorks() {
      const response = await fetch('data/works.json');
      works = await response.json();
    }

    async function loadUserData() {
      const localToken = localStorage.getItem('github-token');
      
      if (localToken) {
        try {
          const response = await fetch('https://api.github.com/repos/mqce/quest/contents/data/user.json', {
            headers: {
              'Authorization': `token ${localToken}`,
              'Accept': 'application/vnd.github.v3+json'
            }
          });
          
          if (response.ok) {
            const data = await response.json();
            const content = atob(data.content);
            userData = JSON.parse(content);
            
            // Migrate thumbnailOverrides to thumbnails format
            if (userData.thumbnailOverrides && !userData.thumbnails) {
              userData.thumbnails = {};
              for (const [id, thumb] of Object.entries(userData.thumbnailOverrides)) {
                userData.thumbnails[id] = [thumb];
              }
              delete userData.thumbnailOverrides;
            }
            
            userData.sha = data.sha;
            return;
          }
        } catch (e) {
          console.warn('Failed to load from GitHub, using localStorage', e);
        }
      }
      
      const localData = localStorage.getItem('user-data');
      if (localData) {
        try {
          const parsed = JSON.parse(localData);
          
          // Ensure userData has valid structure
          userData = {
            favorites: Array.isArray(parsed.favorites) ? parsed.favorites : [],
            thumbnails: {}
          };
          
          // Migrate thumbnailOverrides to thumbnails format
          if (parsed.thumbnailOverrides && typeof parsed.thumbnailOverrides === 'object') {
            for (const [id, thumb] of Object.entries(parsed.thumbnailOverrides)) {
              if (thumb) {
                userData.thumbnails[id] = [thumb];
              }
            }
          }
          
          // Use existing thumbnails if valid
          if (parsed.thumbnails && typeof parsed.thumbnails === 'object') {
            for (const [id, thumbs] of Object.entries(parsed.thumbnails)) {
              if (Array.isArray(thumbs) && thumbs.length > 0) {
                userData.thumbnails[id] = thumbs;
              }
            }
          }
          
          // Preserve sha if exists
          if (parsed.sha) {
            userData.sha = parsed.sha;
          }
        } catch (e) {
          console.warn('Failed to parse localStorage user-data, resetting', e);
          localStorage.removeItem('user-data');
          userData = { favorites: [], thumbnails: {} };
        }
      }
    }

    async function saveUserData() {
      const localToken = localStorage.getItem('github-token');
      
      if (localToken) {
        try {
          const content = btoa(JSON.stringify({
            favorites: userData.favorites,
            thumbnails: userData.thumbnails
          }, null, 2));
          
          const response = await fetch('https://api.github.com/repos/mqce/quest/contents/data/user.json', {
            method: 'PUT',
            headers: {
              'Authorization': `token ${localToken}`,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              message: 'Update user data',
              content: content,
              sha: userData.sha
            })
          });
          
          if (response.ok) {
            const data = await response.json();
            userData.sha = data.content.sha;
            console.log('Saved to GitHub');
            return;
          }
        } catch (e) {
          console.warn('Failed to save to GitHub, using localStorage', e);
        }
      }
      
      localStorage.setItem('user-data', JSON.stringify(userData));
    }

    function getThumbnails(work) {
      // Return user-selected thumbnails
      if (userData.thumbnails[work.id] && userData.thumbnails[work.id].length > 0) {
        return userData.thumbnails[work.id];
      }
      
      // Fall back to work's default thumbnail
      if (work.thumbnail) {
        return [work.thumbnail];
      }
      
      // No thumbnail and no user selection - return empty
      return [];
    }
    
    function hasUserSelectedThumbnail(work) {
      return userData.thumbnails[work.id] && userData.thumbnails[work.id].length > 0;
    }
    
    function needsThumbnailSelection(work) {
      // Needs selection if no default thumbnail and user hasn't selected one yet
      return !work.thumbnail && !hasUserSelectedThumbnail(work);
    }

    function isFavorited(workId) {
      return userData.favorites.includes(workId);
    }

    function toggleFavorite(workId) {
      if (isFavorited(workId)) {
        userData.favorites = userData.favorites.filter(id => id !== workId);
      } else {
        userData.favorites.push(workId);
      }
      saveUserData();
      renderGallery();
    }

    function toggleMenu() {
      const controls = document.getElementById('controls');
      const toggleText = document.getElementById('menu-toggle-text');
      const isVisible = controls.classList.contains('show');
      
      if (isVisible) {
        controls.classList.remove('show');
        toggleText.textContent = '表示設定';
      } else {
        controls.classList.add('show');
        toggleText.textContent = '閉じる';
      }
    }

    function toggleFavoritesFilter() {
      showFavoritesOnly = document.getElementById('favorites-checkbox').checked;
      renderGallery();
    }

    function renderGallery() {
      const gallery = document.getElementById('gallery');
      const emptyState = document.getElementById('empty-state');
      
      let filtered = works;
      
      if (showFavoritesOnly) {
        filtered = works.filter(w => isFavorited(w.id));
      }
      
      if (filtered.length === 0) {
        gallery.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      
      emptyState.style.display = 'none';
      
      const worksByDate = {};
      filtered.forEach(work => {
        if (!worksByDate[work.addedDate]) {
          worksByDate[work.addedDate] = [];
        }
        worksByDate[work.addedDate].push(work);
      });
      
      const sortedDates = Object.keys(worksByDate).sort().reverse();
      
      let html = '';
      let globalIndex = 1;
      sortedDates.forEach(date => {
        const dateWorks = worksByDate[date];
        html += `
          <div class="date-section">
            <h2 class="date-heading">${date} に追加した作品（${dateWorks.length}件）</h2>
            <div class="grid">
              ${dateWorks.map(work => {
                try {
                  const card = createCard(work, globalIndex);
                  globalIndex++;
                  return card;
                } catch (e) {
                  console.error('Failed to render card for work ' + work.id + ':', e);
                  return '';
                }
              }).join('')}
            </div>
          </div>
        `;
      });
      
      gallery.innerHTML = html;
    }

    function createCard(work, index) {
      const thumbnails = getThumbnails(work);
      const favorited = isFavorited(work.id);
      const needsSelection = needsThumbnailSelection(work);
      const hasCandidates = work.candidates && work.candidates.length > 0;
      
      let mediaHtml = '';
      let mediaClickHandler = `openModal('${work.id}')`;
      
      if (thumbnails.length > 0) {
        if (thumbnails.length === 1) {
          // Single thumbnail - no slideshow
          const thumb = thumbnails[0];
          if (thumb.match(/\.(mp4|webm)$/i)) {
            mediaHtml = `<video src="${thumb}" muted loop autoplay playsinline></video>`;
          } else {
            mediaHtml = `<img src="${thumb}" alt="${work.title}" loading="lazy">`;
          }
        } else {
          // Multiple thumbnails - slideshow
          mediaHtml = `<div class="slideshow" data-work-id="${work.id}">`;
          thumbnails.forEach((thumb, idx) => {
            if (thumb.match(/\.(mp4|webm)$/i)) {
              mediaHtml += `<div class="slideshow-item ${idx === 0 ? 'active' : ''}">
                <video src="${thumb}" muted loop ${idx === 0 ? 'autoplay' : ''} playsinline></video>
              </div>`;
            } else if (thumb.match(/youtube\.com\/embed|player\.vimeo\.com/)) {
              mediaHtml += `<div class="slideshow-item ${idx === 0 ? 'active' : ''}">
                <iframe src="${thumb}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen loading="lazy"></iframe>
              </div>`;
            } else {
              mediaHtml += `<div class="slideshow-item ${idx === 0 ? 'active' : ''}">
                <img src="${thumb}" alt="${work.title}" loading="lazy">
              </div>`;
            }
          });
          mediaHtml += `
            <button class="slideshow-arrow prev" onclick="event.stopPropagation(); prevSlide('${work.id}')">‹</button>
            <button class="slideshow-arrow next" onclick="event.stopPropagation(); nextSlide('${work.id}')">›</button>
            <div class="slideshow-dots">
              ${thumbnails.map((_, idx) => `<div class="slideshow-dot ${idx === 0 ? 'active' : ''}" onclick="event.stopPropagation(); goToSlide('${work.id}', ${idx})"></div>`).join('')}
            </div>
          </div>`;
        }
      } else if (needsSelection) {
        // No thumbnail - make placeholder clickable to select (whether or not there are candidates)
        const text = hasCandidates ? 'サムネイル未設定<br>候補から選ぶ' : 'サムネイル未設定<br>URLを貼り付け';
        mediaHtml = `<div class="placeholder clickable">${text}</div>`;
        mediaClickHandler = `openCandidateSelector('${work.id}')`;
      } else {
        // Has thumbnail but not user-selected - should not reach here normally
        mediaHtml = `<div class="placeholder">サムネイル未設定</div>`;
      }
      
      return `
        <div class="card">
          <div class="card-media" onclick="${mediaClickHandler}">
            ${mediaHtml}
            <button class="card-favorite ${favorited ? 'favorited' : ''}" 
                    onclick="event.stopPropagation(); toggleFavorite('${work.id}')">
              ${favorited ? '★' : '☆'}
            </button>
            <button class="btn-select-thumbnails" 
                    onclick="event.stopPropagation(); openCandidateSelector('${work.id}')">
              ${needsSelection ? '候補を選ぶ' : '変更'}
            </button>
          </div>
          <div class="card-body">
            <div class="work-index">[${String(index).padStart(3, '0')}]</div>
            <div class="card-title">${work.title}</div>
            <div class="card-artist">${work.artist} • ${work.year}</div>
            <div class="card-summary">${work.summary}</div>
            <div class="card-tags">
              ${work.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
            </div>
            <div class="card-footer">
              <span>${work.category === 'installation' ? 'インスタレーション' : '小型ロボット'} • ${work.source === 'web' ? 'Web' : 'X'}</span>
              <a href="${work.sourceUrl}" target="_blank" rel="noopener noreferrer">View</a>
            </div>
          </div>
        </div>
      `;
    }

    function prevSlide(workId) {
      const slideshow = document.querySelector(`.slideshow[data-work-id="${workId}"]`);
      if (!slideshow) return;
      
      const items = slideshow.querySelectorAll('.slideshow-item');
      const dots = slideshow.querySelectorAll('.slideshow-dot');
      const activeIdx = Array.from(items).findIndex(item => item.classList.contains('active'));
      
      items[activeIdx].classList.remove('active');
      dots[activeIdx].classList.remove('active');
      
      const newIdx = (activeIdx - 1 + items.length) % items.length;
      items[newIdx].classList.add('active');
      dots[newIdx].classList.add('active');
    }

    function nextSlide(workId) {
      const slideshow = document.querySelector(`.slideshow[data-work-id="${workId}"]`);
      if (!slideshow) return;
      
      const items = slideshow.querySelectorAll('.slideshow-item');
      const dots = slideshow.querySelectorAll('.slideshow-dot');
      const activeIdx = Array.from(items).findIndex(item => item.classList.contains('active'));
      
      items[activeIdx].classList.remove('active');
      dots[activeIdx].classList.remove('active');
      
      const newIdx = (activeIdx + 1) % items.length;
      items[newIdx].classList.add('active');
      dots[newIdx].classList.add('active');
    }

    function goToSlide(workId, idx) {
      const slideshow = document.querySelector(`.slideshow[data-work-id="${workId}"]`);
      if (!slideshow) return;
      
      const items = slideshow.querySelectorAll('.slideshow-item');
      const dots = slideshow.querySelectorAll('.slideshow-dot');
      
      items.forEach(item => item.classList.remove('active'));
      dots.forEach(dot => dot.classList.remove('active'));
      
      items[idx].classList.add('active');
      dots[idx].classList.add('active');
    }

    function openCandidateSelector(workId) {
      const work = works.find(w => w.id === workId);
      if (!work) return;
      
      const modal = document.getElementById('modal');
      const modalMedia = document.getElementById('modal-media');
      const modalBody = document.getElementById('modal-body');
      
      modalMedia.innerHTML = '';
      
      const selectedThumbnails = userData.thumbnails[workId] || [];
      const hasCandidates = work.candidates && work.candidates.length > 0;
      const hasAutoThumbnail = work.thumbnail && !hasUserSelectedThumbnail(work);
      
      // Build combined candidate list: auto thumbnail (if exists) + all candidates
      let allCandidates = [];
      
      // Add auto thumbnail as first option if it exists
      if (work.thumbnail) {
        allCandidates.push({
          type: 'image',
          src: work.thumbnail,
          label: '自動サムネイル'
        });
      }
      
      // Add all candidates
      if (hasCandidates) {
        work.candidates.forEach(candidate => {
          // Skip if it's the same as auto thumbnail
          if (candidate.src !== work.thumbnail) {
            allCandidates.push({
              ...candidate,
              label: null
            });
          }
        });
      }
      
      // Determine what should be pre-checked
      let preChecked = [];
      if (selectedThumbnails.length > 0) {
        // User has saved selections
        preChecked = selectedThumbnails;
      } else if (work.thumbnail) {
        // No user selection, use auto thumbnail
        preChecked = [work.thumbnail];
      }
      
      let candidateGridHtml = '';
      
      if (allCandidates.length > 0) {
        candidateGridHtml = allCandidates.map((candidate, idx) => {
          const isSelected = preChecked.includes(candidate.src);
          const order = preChecked.indexOf(candidate.src) + 1;
          let thumbHtml = '';
          let labelHtml = candidate.label ? `<div style="position: absolute; top: 0.25rem; right: 0.25rem; background: rgba(0,0,0,0.7); color: white; padding: 0.2rem 0.4rem; border-radius: 4px; font-size: 0.65rem;">${candidate.label}</div>` : '';
          
          if (candidate.type === 'video') {
            if (candidate.poster) {
              thumbHtml = `<img src="${candidate.poster}" alt="Video thumbnail" loading="lazy">`;
            } else {
              thumbHtml = `<div style="display: flex; align-items: center; justify-content: center; height: 100%; background: #e9ecef; font-size: 2rem;">▶</div>`;
            }
          } else {
            thumbHtml = `<img src="${candidate.src}" alt="Candidate ${idx + 1}" loading="lazy">`;
          }
          
          return `
            <div class="candidate-item ${isSelected ? 'selected' : ''}" 
                 data-src="${candidate.src}" 
                 onclick="toggleCandidate('${workId}', '${candidate.src.replace(/'/g, "\\'")}')">
              ${thumbHtml}
              ${labelHtml}
              <div class="candidate-order">${order || ''}</div>
            </div>
          `;
        }).join('');
        
        // Initialize userData.thumbnails with pre-checked items if user hasn't selected anything yet
        if (selectedThumbnails.length === 0 && preChecked.length > 0) {
          userData.thumbnails[workId] = [...preChecked];
        }
      } else {
        candidateGridHtml = `<p style="color: #999; margin: 1rem 0;">この作品には候補画像がありません。</p>`;
      }
      
      modalBody.innerHTML = `
        <h2>サムネイルを選択 - ${work.title}</h2>
        <div class="candidate-selector">
          <h4>${allCandidates.length > 0 ? '候補一覧（クリックして選択、複数選択可）' : 'サムネイル候補'}</h4>
          <div class="candidate-grid" id="candidate-grid">
            ${candidateGridHtml}
          </div>
          
          ${allCandidates.length > 0 ? `
          <div class="candidate-controls">
            <button onclick="saveThumbnailSelection('${work.id}')">保存</button>
            <button onclick="closeModal()" class="btn-secondary">キャンセル</button>
            ${userData.thumbnails[workId] && userData.thumbnails[workId].length > 0 ? `<button onclick="clearThumbnailSelection('${work.id}')" class="btn-secondary">選択をクリア</button>` : ''}
          </div>
          ` : ''}
        </div>
        
        <div class="thumbnail-upload">
          <h4>URLから追加</h4>
          <input type="text" id="thumbnail-url" placeholder="画像または動画のURL（https://...）">
          <button onclick="updateThumbnail('${work.id}')">適用</button>
          ${userData.thumbnails[workId] && userData.thumbnails[workId].length > 0 ? `<button onclick="resetThumbnail('${work.id}')" class="btn-secondary">元に戻す</button>` : ''}
        </div>
      `;
      
      modal.classList.add('show');
    }

    function toggleCandidate(workId, src) {
      if (!userData.thumbnails[workId]) {
        userData.thumbnails[workId] = [];
      }
      
      const thumbnails = userData.thumbnails[workId];
      const idx = thumbnails.indexOf(src);
      
      if (idx >= 0) {
        thumbnails.splice(idx, 1);
      } else {
        thumbnails.push(src);
      }
      
      // Update UI
      const candidateItem = document.querySelector(`.candidate-item[data-src="${src.replace(/"/g, '&quot;')}"]`);
      if (candidateItem) {
        if (idx >= 0) {
          candidateItem.classList.remove('selected');
        } else {
          candidateItem.classList.add('selected');
        }
        
        // Update order numbers
        document.querySelectorAll('.candidate-item').forEach(item => {
          const itemSrc = item.getAttribute('data-src');
          const order = thumbnails.indexOf(itemSrc) + 1;
          const orderEl = item.querySelector('.candidate-order');
          if (orderEl) {
            orderEl.textContent = order || '';
          }
        });
      }
    }

    async function saveThumbnailSelection(workId) {
      await saveUserData();
      closeModal();
      renderGallery();
    }

    async function clearThumbnailSelection(workId) {
      delete userData.thumbnails[workId];
      await saveUserData();
      closeModal();
      renderGallery();
    }

    function openModal(workId) {
      const work = works.find(w => w.id === workId);
      if (!work) return;
      
      const modal = document.getElementById('modal');
      const modalMedia = document.getElementById('modal-media');
      const modalBody = document.getElementById('modal-body');
      
      const thumbnails = getThumbnails(work);
      
      let mediaHtml = '';
      if (thumbnails.length > 0) {
        const thumb = thumbnails[0];
        if (thumb.match(/\.(mp4|webm)$/i)) {
          mediaHtml = `<video src="${thumb}" controls style="max-width: 100%; max-height: 400px;"></video>`;
        } else if (thumb.match(/youtube\.com\/embed|player\.vimeo\.com/)) {
          mediaHtml = `<iframe src="${thumb}" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen style="width: 100%; height: 400px;"></iframe>`;
        } else {
          mediaHtml = `<img src="${thumb}" alt="${work.title}">`;
        }
      } else {
        mediaHtml = `<div style="padding: 2rem; color: #999;">サムネイル未設定</div>`;
      }
      
      modalMedia.innerHTML = mediaHtml;
      
      const hasCandidates = work.candidates && work.candidates.length > 0;
      const needsSelection = needsThumbnailSelection(work);
      const hasUserThumbnail = hasUserSelectedThumbnail(work);
      
      let candidateSectionHtml = '';
      if (hasCandidates) {
        if (needsSelection) {
          // No thumbnail yet - show prominent button
          candidateSectionHtml = `
        <div class="thumbnail-upload">
          <h4>サムネイル候補から選ぶ</h4>
          <button onclick="openCandidateSelector('${work.id}')">候補一覧を開く（${work.candidates.length}個）</button>
        </div>`;
        } else if (hasUserThumbnail || work.thumbnail) {
          // Has thumbnail - show subtle re-select link
          candidateSectionHtml = `
        <div class="thumbnail-upload">
          <p style="margin: 0; color: #999; font-size: 0.9rem;">
            <a href="javascript:void(0);" onclick="openCandidateSelector('${work.id}')" style="color: #999;">選び直す</a>
          </p>
        </div>`;
        }
      }
      
      modalBody.innerHTML = `
        <h2>${work.title}</h2>
        <p style="color: #999; margin-bottom: 1rem;">${work.artist} • ${work.year}</p>
        <p style="margin-bottom: 1rem; color: #b8b8b8;">${work.summary}</p>
        <div style="margin-bottom: 1rem;">
          ${work.tags.map(tag => `<span class="tag">${tag}</span>`).join(' ')}
        </div>
        <p style="margin-bottom: 1rem; color: #b8b8b8;">
          <strong style="color: #e5e5e5;">カテゴリ：</strong>${work.category === 'installation' ? 'インスタレーション' : '小型ロボット'}<br>
          <strong style="color: #e5e5e5;">出典：</strong>${work.sourceSite}<br>
          <strong style="color: #e5e5e5;">追加日：</strong>${work.addedDate}
        </p>
        <a href="${work.sourceUrl}" target="_blank" rel="noopener noreferrer" style="color: #e5e5e5; border-bottom: 1px solid #666;">元ページを開く →</a>
        
        ${candidateSectionHtml}
        
        <div class="thumbnail-upload">
          <h4>URLから追加</h4>
          <input type="text" id="thumbnail-url" placeholder="画像または動画のURL（https://...）">
          <input type="file" id="thumbnail-file" accept="image/*,video/*">
          <button onclick="updateThumbnail('${work.id}')">適用</button>
          ${thumbnails.length > 0 ? `<button onclick="resetThumbnail('${work.id}')" class="btn-secondary">元に戻す</button>` : ''}
        </div>
      `;
      
      modal.classList.add('show');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('show');
    }

    async function updateThumbnail(workId) {
      const urlInput = document.getElementById('thumbnail-url');
      const fileInput = document.getElementById('thumbnail-file');
      
      if (urlInput.value) {
        if (!userData.thumbnails[workId]) {
          userData.thumbnails[workId] = [];
        }
        userData.thumbnails[workId].push(urlInput.value);
        await saveUserData();
        closeModal();
        renderGallery();
      } else if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onload = async (e) => {
          const localToken = localStorage.getItem('github-token');
          let thumbnailUrl = e.target.result;
          
          if (localToken) {
            try {
              const content = e.target.result.split(',')[1];
              const fileName = `media/override-${workId}-${Date.now()}${file.name.substring(file.name.lastIndexOf('.'))}`;
              
              const response = await fetch(`https://api.github.com/repos/mqce/quest/contents/${fileName}`, {
                method: 'PUT',
                headers: {
                  'Authorization': `token ${localToken}`,
                  'Accept': 'application/vnd.github.v3+json',
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  message: `Add thumbnail for ${workId}`,
                  content: content
                })
              });
              
              if (response.ok) {
                thumbnailUrl = fileName;
              }
            } catch (e) {
              console.warn('Failed to upload to GitHub', e);
            }
          }
          
          if (!userData.thumbnails[workId]) {
            userData.thumbnails[workId] = [];
          }
          userData.thumbnails[workId].push(thumbnailUrl);
          await saveUserData();
          closeModal();
          renderGallery();
        };
        
        reader.readAsDataURL(file);
      }
    }

    async function resetThumbnail(workId) {
      delete userData.thumbnails[workId];
      await saveUserData();
      closeModal();
      renderGallery();
    }

    function setupEventListeners() {
      document.getElementById('modal').addEventListener('click', (e) => {
        if (e.target.id === 'modal') {
          closeModal();
        }
      });
      
      setupSwipeSupport();
    }

    function setupSwipeSupport() {
      let touchStartX = 0;
      let touchEndX = 0;
      
      document.addEventListener('touchstart', (e) => {
        const slideshow = e.target.closest('.slideshow');
        if (!slideshow) return;
        touchStartX = e.changedTouches[0].screenX;
      });
      
      document.addEventListener('touchend', (e) => {
        const slideshow = e.target.closest('.slideshow');
        if (!slideshow) return;
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe(slideshow);
      });
      
      function handleSwipe(slideshow) {
        const threshold = 50;
        const diff = touchStartX - touchEndX;
        
        if (Math.abs(diff) < threshold) return;
        
        const workId = slideshow.getAttribute('data-work-id');
        if (diff > 0) {
          nextSlide(workId);
        } else {
          prevSlide(workId);
        }
      }
    }

    function openSettings() {
      const panel = document.getElementById('settings-panel');
      const tokenInput = document.getElementById('github-token');
      tokenInput.value = localStorage.getItem('github-token') || '';
      panel.classList.add('show');
    }

    function closeSettings() {
      document.getElementById('settings-panel').classList.remove('show');
    }

    function saveSettings() {
      const token = document.getElementById('github-token').value.trim();
      if (token) {
        localStorage.setItem('github-token', token);
      } else {
        localStorage.removeItem('github-token');
      }
      alert('設定を保存しました');
      closeSettings();
    }

    function exportData() {
      const exportTextarea = document.getElementById('export-data');
      exportTextarea.value = JSON.stringify({
        favorites: userData.favorites,
        thumbnails: userData.thumbnails
      }, null, 2);
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          userData.favorites = imported.favorites || [];
          
          // Support both old and new format
          if (imported.thumbnails) {
            userData.thumbnails = imported.thumbnails;
          } else if (imported.thumbnailOverrides) {
            userData.thumbnails = {};
            for (const [id, thumb] of Object.entries(imported.thumbnailOverrides)) {
              userData.thumbnails[id] = [thumb];
            }
          }
          
          await saveUserData();
          renderGallery();
          alert('データをインポートしました');
        } catch (err) {
          alert('インポートに失敗しました: ' + err.message);
        }
      };
      reader.readAsText(file);
    }

    init();
  </script>
</body>
</html>
